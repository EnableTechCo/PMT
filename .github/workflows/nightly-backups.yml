name: Nightly Backups

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Trigger backup snapshot
        env:
          BACKUP_ENDPOINT_URL: ${{ secrets.BACKUP_ENDPOINT_URL || vars.BACKUP_ENDPOINT_URL }}
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || vars.NEXT_PUBLIC_APP_URL }}
          BACKUP_SCHEDULE_SECRET: ${{ secrets.BACKUP_SCHEDULE_SECRET || vars.BACKUP_SCHEDULE_SECRET }}
        run: |
          ENDPOINT_URL="$BACKUP_ENDPOINT_URL"

          if [ -z "$ENDPOINT_URL" ] && [ -n "$APP_URL" ]; then
            ENDPOINT_URL="${APP_URL%/}/api/settings/backup"
          fi

          if [ -z "$ENDPOINT_URL" ] && [ -n "$NEXT_PUBLIC_APP_URL" ]; then
            ENDPOINT_URL="${NEXT_PUBLIC_APP_URL%/}/api/settings/backup"
          fi

          case "$ENDPOINT_URL" in
            */api/settings/backup) ;;
            http://*|https://*) ENDPOINT_URL="${ENDPOINT_URL%/}/api/settings/backup" ;;
          esac

          if [ -z "$ENDPOINT_URL" ] || [ -z "$BACKUP_SCHEDULE_SECRET" ]; then
            echo "::warning::Missing backup config. Required: BACKUP_SCHEDULE_SECRET and one of BACKUP_ENDPOINT_URL/APP_URL/NEXT_PUBLIC_APP_URL. Skipping backup trigger."
            exit 0
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out "%{http_code}" \
            -X POST "$ENDPOINT_URL" \
            -H "Content-Type: application/json" \
            -H "x-backup-secret: $BACKUP_SCHEDULE_SECRET")"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Backup trigger failed with HTTP $HTTP_CODE at $ENDPOINT_URL"
            echo "Response body:"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Backup trigger succeeded with HTTP $HTTP_CODE"
