name: Nightly Backups

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Trigger backup snapshot
        env:
          BACKUP_ENDPOINT_URL: ${{ secrets.BACKUP_ENDPOINT_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          BACKUP_SCHEDULE_SECRET: ${{ secrets.BACKUP_SCHEDULE_SECRET }}
        run: |
          ENDPOINT_URL="$BACKUP_ENDPOINT_URL"

          if [ -z "$ENDPOINT_URL" ] && [ -n "$APP_URL" ]; then
            ENDPOINT_URL="${APP_URL%/}/api/settings/backup"
          fi

          if [ -z "$ENDPOINT_URL" ] && [ -n "$NEXT_PUBLIC_APP_URL" ]; then
            ENDPOINT_URL="${NEXT_PUBLIC_APP_URL%/}/api/settings/backup"
          fi

          if [ -z "$ENDPOINT_URL" ] || [ -z "$BACKUP_SCHEDULE_SECRET" ]; then
            echo "::warning::Missing backup config. Required: BACKUP_SCHEDULE_SECRET and one of BACKUP_ENDPOINT_URL/APP_URL/NEXT_PUBLIC_APP_URL. Skipping backup trigger."
            exit 0
          fi

          curl --fail --show-error --silent \
            -X POST "$ENDPOINT_URL" \
            -H "Content-Type: application/json" \
            -H "x-backup-secret: $BACKUP_SCHEDULE_SECRET"
